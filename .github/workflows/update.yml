name: Update Stock Screener

on:
  schedule:
    # Berjalan Senin-Jumat jam 09:30 UTC (16:30 WIB)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy

      - name: Run Screener
        run: python screener.py

      - name: Commit and Push JSON Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update screener results [skip ci]" || exit 0
          git push
